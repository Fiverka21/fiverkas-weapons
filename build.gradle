plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "KosmX"
        url = "https://maven.kosmx.dev/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Better Combat 2.3.1+1.21.1-fabric (supports weapon trail_appearance data)
    modImplementation "maven.modrinth:5sy6g3kz:zZCcohvX"

    // Better Combat's own runtime requirements on Fabric
    modImplementation "maven.modrinth:cloth-config:15.0.140+fabric"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:2.0.4+1.21.1"
    // Better Combat 2.3.1 bundles Tiny Config, but Loom's development
    // classpath does not expose the nested jar automatically.
    modImplementation "maven.modrinth:tiny-config:3.1.0-fabric"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}
tasks.withType(JavaExec).configureEach {
    javaLauncher.set(java21Launcher)
}

processResources {
    inputs.property "version", project.version
    inputs.properties([
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_version     : mod_version,
            minecraft_version: minecraft_version
    ])
    filesMatching("fabric.mod.json") {
        expand([
                mod_id          : mod_id,
                mod_name        : mod_name,
                mod_version     : mod_version,
                minecraft_version: minecraft_version
        ])
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
    repositories {
        mavenLocal()
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }
        mavenCentral()
    }
}
